<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Character Card</title>

        <meta property="og:type" content="website">
        <meta property="og:title" content="Snortleblat Character Card">
        <meta property="og:description" content="Level 8 Swamp Beast Diplomat - RPG Character Stats">
        <meta property="og:url" content="https://jason-madsen.github.io/wdd131/charactercard">
        <meta property="og:image" content="images/cardimage.png">

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Snortleblat Character Card">
        <meta name="twitter:description" content="A custom RPG card built with JavaScript Objects.">
        <meta name="twitter:image" content="images/cardimage.png">

        <!-- One favicon (ICO works everywhere) -->
        <link rel="icon" href="images/favicon.ico">

        <!-- One Apple Touch Icon (iOS home screen) -->
        <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
        
        <link rel="stylesheet" href="styles.css">
        <script src="card.js" defer></script>
    </head>
    <body>
        <main class="card">
            <div>
                <img class="image">
            </div>
            <div>
                <h1 class="name" id="cardName"></h1>
            </div>
            <div id="statsContainer" class="stats"></div>
            <div class="buttons">
                <button id="attackButton">Attacked</button>
                <button id="levelUpButton">Level Up</button>
            </div>
        </main>
    </body>
</html>
