<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Credit card styled form">
    <meta name="author" content="Jason Madsen">
    <title>Credit Card Form</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <script src="credit.js" defer></script>
</head>
<body>
    <main>
        <div class="errors"></div>
        <form id="card-form" action="#" method="get">
            <div id="cardFront" class="card-style">
                <div id="total">
                    <p>TOTAL: $199</p>
                    <div id="creditCardSymbol">💳</div>
                </div>
                <div id="cardNumber">
                    <label for="cardNumberInput">CARD NUMBER</label>
                    <input type="text" id="cardNumberInput" name="cardNumber" pattern="[0-9]{16}" placeholder="1234 5678 9101 1020" required>
                </div>
                <div id="cardHolder">
                    <label for="cardHolderInput">CARD HOLDER</label>
                    <input type="text" name="cardHolder" id="cardHolderInput" placeholder="John Doe" required>
                </div>
                <div id="cardExpiration">
                    <label for="expirationDate">EXPIRATION</label>
                    <input type='text' id='month' name="expMonth" placeholder="MM" aria-labelledby="expirationDate" required>
                    <input type='text' id='year' name="expYear" placeholder="YY" aria-labelledby="expirationDate" required>
                </div>
            </div>
            <div id="cardBack" class="card-style">
                <div class="blackBar"></div>
                <div id="cvc-ccv-container">
                    <label for="cvc-ccv">CVC/CVV</label>
                    <input type="text" name="cvc-ccv" id="cvc-ccv" placeholder="xxx" required>
                </div>
            </div>
            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
